<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container for consistency -->
  <rect width="512" height="512" rx="128" fill="#09090b" />
  
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#grad1)" stroke-width="40" filter="url(#glow)" />
  
  <!-- Inner tech star/spark -->
  <path d="M256 120 L275 237 L392 256 L275 275 L256 392 L237 275 L120 256 L237 237 Z" fill="url(#grad2)" filter="url(#glow)" />
  
  <!-- Center dot -->
  <circle cx="256" cy="256" r="32" fill="#09090b" />
</svg>
